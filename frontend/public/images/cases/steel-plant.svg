<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Blast furnace silhouette -->
  <rect x="250" y="80" width="120" height="280" rx="8" fill="#2d3436" opacity="0.8"/>
  <rect x="270" y="60" width="80" height="40" rx="4" fill="#636e72" opacity="0.6"/>
  <rect x="350" y="140" width="40" height="100" rx="4" fill="#b2bec3" opacity="0.4"/>
  <rect x="370" y="200" width="60" height="8" rx="2" fill="#dfe6e9" opacity="0.3"/>
  <!-- Sparks -->
  <circle cx="310" cy="130" r="3" fill="#ff6b35" opacity="0.8"/>
  <circle cx="290" cy="110" r="2" fill="#e94560" opacity="0.6"/>
  <circle cx="330" cy="100" r="2.5" fill="#ff6b35" opacity="0.7"/>
  <circle cx="280" cy="145" r="1.5" fill="#fdcb6e" opacity="0.9"/>
  <circle cx="340" cy="120" r="1.8" fill="#e94560" opacity="0.5"/>
  <!-- Ground -->
  <rect x="0" y="360" width="800" height="90" fill="#0a0a1a" opacity="0.5"/>
  <!-- Factory building silhouette -->
  <rect x="500" y="150" width="200" height="210" rx="4" fill="#2d3436" opacity="0.6"/>
  <rect x="520" y="180" width="40" height="30" rx="2" fill="#fdcb6e" opacity="0.15"/>
  <rect x="580" y="180" width="40" height="30" rx="2" fill="#fdcb6e" opacity="0.15"/>
  <rect x="640" y="180" width="40" height="30" rx="2" fill="#fdcb6e" opacity="0.15"/>
  <!-- Smoke stacks -->
  <rect x="530" y="80" width="12" height="70" rx="2" fill="#636e72" opacity="0.5"/>
  <rect x="590" y="60" width="12" height="90" rx="2" fill="#636e72" opacity="0.5"/>
  <rect x="650" y="90" width="12" height="60" rx="2" fill="#636e72" opacity="0.5"/>
  <!-- Text -->
  <text x="400" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#ffffff" opacity="0.7">柳钢集团 · 冶金工业</text>
</svg>
