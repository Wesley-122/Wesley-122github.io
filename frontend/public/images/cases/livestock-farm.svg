  <rect x="45" y="150" width="55" height="40" rx="2" fill="#fdcb6e" opacity="0.15"/>
  <rect x="115" y="150" width="55" height="40" rx="2" fill="#fdcb6e" opacity="0.15"/>
  <rect x="185" y="150" width="55" height="40" rx="2" fill="#fdcb6e" opacity="0.15"/>
  <polygon points="10,120 140,40 270,120" fill="#1a3a0a" opacity="0.4"/>
