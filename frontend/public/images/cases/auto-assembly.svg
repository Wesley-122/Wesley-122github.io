<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="50%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Assembly line -->
  <rect x="0" y="300" width="800" height="150" fill="#0a1628" opacity="0.6"/>
  <rect x="100" y="280" width="600" height="8" rx="2" fill="#4a90d9" opacity="0.3"/>
  <!-- Robot arms -->
  <line x1="250" y1="280" x2="280" y2="180" stroke="#636e72" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="280" y1="180" x2="320" y2="160" stroke="#636e72" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <circle cx="320" cy="160" r="8" fill="#f39c12" opacity="0.7"/>
  <line x1="450" y1="280" x2="420" y2="170" stroke="#636e72" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="420" y1="170" x2="380" y2="150" stroke="#636e72" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <circle cx="380" cy="150" r="8" fill="#f39c12" opacity="0.7"/>
  <line x1="650" y1="280" x2="620" y2="175" stroke="#636e72" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="620" y1="175" x2="580" y2="155" stroke="#636e72" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <circle cx="580" cy="155" r="8" fill="#f39c12" opacity="0.7"/>
  <!-- Car body on line -->
  <rect x="150" y="260" width="150" height="40" rx="8" fill="#4a90d9" opacity="0.2"/>
  <rect x="350" y="260" width="150" height="40" rx="8" fill="#bdc3c7" opacity="0.15"/>
  <rect x="550" y="260" width="150" height="40" rx="8" fill="#4a90d9" opacity="0.2"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" opacity="0.03"/></pattern>
  <rect width="800" height="450" fill="url(#grid)"/>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#ffffff" opacity="0.7">上汽通用五菱 · 汽车制造</text>
</svg>
