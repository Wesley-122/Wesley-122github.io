<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2838"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Factory floor grid -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M 50 0 L 0 0 0 50" fill="none" stroke="#4a90d9" opacity="0.06"/></pattern>
  <rect width="800" height="450" fill="url(#grid)"/>
  <!-- IoT devices -->
  <rect x="100" y="100" width="60" height="40" rx="4" fill="#3498db" opacity="0.3"/>
  <rect x="200" y="140" width="60" height="40" rx="4" fill="#3498db" opacity="0.25"/>
  <rect x="500" y="80" width="60" height="40" rx="4" fill="#3498db" opacity="0.3"/>
  <rect x="600" y="150" width="60" height="40" rx="4" fill="#3498db" opacity="0.25"/>
  <!-- Connection lines -->
  <line x1="160" y1="120" x2="230" y2="160" stroke="#2ecc71" stroke-width="1.5" opacity="0.3"/>
  <line x1="230" y1="160" x2="530" y2="100" stroke="#2ecc71" stroke-width="1.5" opacity="0.3"/>
  <line x1="530" y1="100" x2="630" y2="170" stroke="#2ecc71" stroke-width="1.5" opacity="0.3"/>
  <!-- Central dashboard -->
  <rect x="250" y="230" width="300" height="130" rx="10" fill="#1a1a2e" opacity="0.7" stroke="#3498db" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="270" y="250" width="120" height="4" rx="2" fill="#3498db" opacity="0.5"/>
  <rect x="270" y="265" width="90" height="4" rx="2" fill="#2ecc71" opacity="0.4"/>
  <rect x="270" y="280" width="150" height="4" rx="2" fill="#f39c12" opacity="0.3"/>
  <circle cx="480" cy="295" r="30" fill="none" stroke="#3498db" stroke-width="2" opacity="0.3"/>
  <!-- Data nodes -->
  <circle cx="130" cy="120" r="4" fill="#2ecc71" opacity="0.6"/>
  <circle cx="230" cy="160" r="4" fill="#f39c12" opacity="0.6"/>
  <circle cx="530" cy="100" r="4" fill="#2ecc71" opacity="0.6"/>
  <circle cx="630" cy="170" r="4" fill="#3498db" opacity="0.6"/>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#ffffff" opacity="0.7">柳钢东信 · 工业物联网</text>
</svg>
