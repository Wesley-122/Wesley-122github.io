<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#1b3a5c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Rolling mill -->
  <rect x="200" y="120" width="400" height="180" rx="10" fill="#2c3e50" opacity="0.5"/>
  <!-- Rollers -->
  <rect x="220" y="170" width="80" height="20" rx="10" fill="#7f8c8d" opacity="0.4"/>
  <rect x="360" y="170" width="80" height="20" rx="10" fill="#7f8c8d" opacity="0.4"/>
  <rect x="500" y="170" width="80" height="20" rx="10" fill="#7f8c8d" opacity="0.4"/>
  <rect x="220" y="250" width="80" height="20" rx="10" fill="#7f8c8d" opacity="0.4"/>
  <rect x="360" y="250" width="80" height="20" rx="10" fill="#7f8c8d" opacity="0.4"/>
  <rect x="500" y="250" width="80" height="20" rx="10" fill="#7f8c8d" opacity="0.4"/>
  <!-- Hot steel -->
  <rect x="240" y="195" width="320" height="6" rx="3" fill="#e74c3c" opacity="0.9"/>
  <rect x="240" y="205" width="320" height="2" rx="1" fill="#f39c12" opacity="0.6"/>
  <!-- Sparks -->
  <circle cx="300" cy="200" r="4" fill="#f39c12" opacity="0.8"/>
  <circle cx="450" cy="198" r="3" fill="#e74c3c" opacity="0.7"/>
  <circle cx="520" cy="202" r="5" fill="#f39c12" opacity="0.6"/>
  <circle cx="380" cy="196" r="2" fill="#e74c3c" opacity="0.9"/>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#ffffff" opacity="0.7">柳钢中金 · 轧辊管理</text>
</svg>
