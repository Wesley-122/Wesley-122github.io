<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3a2a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Battery cells grid -->
  <rect x="140" y="60" width="120" height="80" rx="8" fill="#27ae60" opacity="0.3"/>
  <rect x="270" y="60" width="120" height="80" rx="8" fill="#27ae60" opacity="0.3"/>
  <rect x="400" y="60" width="120" height="80" rx="8" fill="#27ae60" opacity="0.3"/>
  <rect x="530" y="60" width="120" height="80" rx="8" fill="#27ae60" opacity="0.3"/>
  <rect x="140" y="155" width="120" height="80" rx="8" fill="#2ecc71" opacity="0.2"/>
  <rect x="270" y="155" width="120" height="80" rx="8" fill="#2ecc71" opacity="0.2"/>
  <rect x="400" y="155" width="120" height="80" rx="8" fill="#2ecc71" opacity="0.2"/>
  <rect x="530" y="155" width="120" height="80" rx="8" fill="#2ecc71" opacity="0.2"/>
  <!-- Energy lines -->
  <line x1="200" y1="100" x2="400" y2="100" stroke="#f1c40f" stroke-width="2" opacity="0.4"/>
  <line x1="330" y1="195" x2="400" y2="195" stroke="#f1c40f" stroke-width="2" opacity="0.4"/>
  <!-- Dashboard screen -->
  <rect x="250" y="280" width="300" height="100" rx="8" fill="#1a1a2e" opacity="0.6" stroke="#4a90d9" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="270" y1="300" x2="500" y2="300" stroke="#27ae60" stroke-width="2" opacity="0.5"/>
  <line x1="270" y1="320" x2="450" y2="320" stroke="#3498db" stroke-width="2" opacity="0.4"/>
  <circle cx="530" cy="310" r="25" fill="none" stroke="#27ae60" stroke-width="3" opacity="0.4"/>
  <text x="530" y="316" text-anchor="middle" font-family="monospace" font-size="12" fill="#27ae60" opacity="0.6">78%</text>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#ffffff" opacity="0.7">赛克瑞浦 · 新能源电池</text>
</svg>
