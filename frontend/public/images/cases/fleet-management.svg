<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- City skyline -->
  <rect x="0" y="250" width="800" height="200" fill="#0d1b2a" opacity="0.5"/>
  <rect x="50" y="180" width="60" height="100" rx="2" fill="#1a1a2e" opacity="0.5"/>
  <rect x="130" y="140" width="50" height="140" rx="2" fill="#1a1a2e" opacity="0.5"/>
  <rect x="200" y="200" width="70" height="80" rx="2" fill="#1a1a2e" opacity="0.4"/>
  <rect x="550" y="160" width="55" height="120" rx="2" fill="#1a1a2e" opacity="0.5"/>
  <rect x="620" y="190" width="65" height="90" rx="2" fill="#1a1a2e" opacity="0.4"/>
  <rect x="700" y="150" width="50" height="130" rx="2" fill="#1a1a2e" opacity="0.5"/>
  <!-- Windows/lights -->
  <rect x="138" y="150" width="8" height="6" rx="1" fill="#fdcb6e" opacity="0.2"/>
  <rect x="155" y="170" width="8" height="6" rx="1" fill="#fdcb6e" opacity="0.2"/>
  <rect x="138" y="190" width="8" height="6" rx="1" fill="#fdcb6e" opacity="0.2"/>
  <rect x="558" y="170" width="8" height="6" rx="1" fill="#fdcb6e" opacity="0.2"/>
  <rect x="575" y="200" width="8" height="6" rx="1" fill="#fdcb6e" opacity="0.2"/>
  <!-- Road -->
  <rect x="0" y="280" width="800" height="170" fill="#1a1a2e" opacity="0.7"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#fdcb6e" stroke-width="2" opacity="0.15" stroke-dasharray="30,20"/>
  <!-- Vehicles on road -->
  <rect x="200" y="295" width="80" height="25" rx="6" fill="#3498db" opacity="0.3"/>
  <rect x="400" y="310" width="70" height="22" rx="5" fill="#2ecc71" opacity="0.25"/>
  <rect x="580" y="295" width="75" height="24" rx="6" fill="#e74c3c" opacity="0.2"/>
  <!-- Dashboard overlay -->
  <rect x="100" y="30" width="250" height="80" rx="8" fill="#1a1a2e" opacity="0.7" stroke="#3498db" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="140" cy="60" r="20" fill="none" stroke="#3498db" stroke-width="2" opacity="0.4"/>
  <text x="190" y="55" font-family="monospace" font-size="11" fill="#3498db" opacity="0.5">Active: 247</text>
  <text x="190" y="75" font-family="monospace" font-size="11" fill="#2ecc71" opacity="0.4">Online: 92%</text>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#ffffff" opacity="0.7">OK出行 · 智慧物流</text>
</svg>
